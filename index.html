
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090d18">
<title>ABD AI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #090d18;
  color: #f5f7ff;
  font-family: Arial, sans-serif;
}

button, textarea, input { font: inherit; }

button {
  cursor: pointer;
  border: 0;
  border-radius: 10px;
  padding: 11px 15px;
  color: white;
  background: #625cff;
}

button:disabled { opacity: .5; }

.app {
  max-width: 1100px;
  margin: auto;
  min-height: 100vh;
  display: flex;
}

.sidebar {
  width: 250px;
  flex-shrink: 0;
  background: #0e1423;
  border-right: 1px solid #252e43;
  padding: 18px;
  display: flex;
  flex-direction: column;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 25px;
}

.logo {
  width: 43px;
  height: 43px;
  border-radius: 13px;
  display: grid;
  place-items: center;
  font-weight: bold;
  background: linear-gradient(135deg,#2563eb,#9333ea);
}

.brand h2 { margin: 0; font-size: 20px; }

.new-chat {
  width: 100%;
  background: #242d43;
  border: 1px solid #35405a;
  text-align: left;
  margin-bottom: 20px;
}

.small-title {
  color: #8995ad;
  font-size: 12px;
  margin-bottom: 10px;
}

#history {
  display: flex;
  flex-direction: column;
  gap: 7px;
  overflow-y: auto;
}

.history-item {
  background: transparent;
  text-align: left;
  color: #c8d0e0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.history-item.active { background: #252e43; }

.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.topbar {
  padding: 17px 20px;
  border-bottom: 1px solid #252e43;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.topbar h3 { margin: 0; font-size: 17px; }

.content {
  width: 100%;
  max-width: 800px;
  padding: 20px;
  margin: auto;
  flex: 1;
  display: flex;
  flex-direction: column;
}

.welcome {
  text-align: center;
  margin: auto 0;
  padding: 35px 10px;
}

.welcome h1 { font-size: 32px; }

.gradient {
  background: linear-gradient(90deg,#60a5fa,#c084fc);
  -webkit-background-clip: text;
  color: transparent;
}

#messages {
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding-bottom: 25px;
}

.message {
  padding: 15px;
  border-radius: 14px;
  max-width: 95%;
  line-height: 1.65;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user {
  background: #263a70;
  align-self: flex-end;
}

.assistant {
  background: #171f32;
  align-self: flex-start;
}

.message-actions { margin-top: 9px; }

.message-actions button {
  background: #303a50;
  font-size: 12px;
  padding: 7px 10px;
}

.composer-area {
  position: sticky;
  bottom: 0;
  background: #090d18;
  padding: 12px 0 18px;
}

.composer {
  display: flex;
  gap: 9px;
  background: #151e30;
  border: 1px solid #34405a;
  border-radius: 15px;
  padding: 9px;
}

textarea, input {
  background: transparent;
  color: white;
  border: 0;
  outline: none;
  width: 100%;
}

textarea {
  resize: none;
  min-height: 45px;
  max-height: 150px;
  padding: 12px 5px;
}

.status {
  color: #9ba8c2;
  font-size: 12px;
  min-height: 18px;
  margin-top: 8px;
}

.auth-box {
  max-width: 420px;
  margin: 70px auto;
  padding: 25px;
  background: #151e30;
  border: 1px solid #303b55;
  border-radius: 17px;
}

.auth-box input {
  padding: 14px;
  margin: 8px 0;
  border: 1px solid #34405a;
  border-radius: 9px;
  background: #090d18;
}

.auth-box button { margin-top: 10px; }

.secondary { background: #303a50; }

.hidden { display: none !important; }

@media(max-width:650px) {
  .sidebar {
    width: 76px;
    padding: 12px 7px;
  }
  .brand {
    flex-direction: column;
    gap: 5px;
  }
  .brand h2 { font-size: 10px; }
  .new-chat {
    text-align: center;
    padding: 12px 3px;
    font-size: 11px;
  }
  .small-title { font-size: 9px; text-align: center; }
  .history-item {
    font-size: 10px;
    padding: 9px 3px;
  }
  .content { padding: 13px; }
  .topbar { padding: 14px; }
  .message { max-width: 100%; }
}
</style>
</head>

<body>

<div id="auth" class="auth-box">
  <div class="brand">
    <div class="logo">ABD</div>
    <h2>ABD AI</h2>
  </div>
  <p>Welcome to your AI assistant.</p>
  <input id="email" type="email" placeholder="Email address">
  <input id="password" type="password" placeholder="Password">
  <button id="signup">Create account</button>
  <button id="login" class="secondary">Sign in</button>
  <p id="authStatus" class="status"></p>
</div>

<div id="app" class="app hidden">

  <aside class="sidebar">
    <div class="brand">
      <div class="logo">ABD</div>
      <h2>ABD AI</h2>
    </div>

    <button class="new-chat" id="newChat">＋ New Chat</button>

    <div class="small-title">YOUR CONVERSATIONS</div>
    <div id="history"></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h3>ABD AI Assistant</h3>
      <button class="secondary" id="logout">Sign out</button>
    </header>

    <section class="content">
      <div id="welcome" class="welcome">
        <h1>Welcome to <span class="gradient">ABD AI</span></h1>
        <p style="color:#929bb1">
          What would you like to know today?
        </p>
      </div>

      <div id="messages"></div>

      <div class="composer-area">
        <div class="composer">
          <textarea id="prompt"
            placeholder="Message ABD AI..."
            rows="1"></textarea>
          <button id="send">Send</button>
        </div>
        <div id="chatStatus" class="status">
          ABD AI is ready.
        </div>
      </div>
    </section>
  </main>
</div>

<script>

const SUPABASE_URL = "https://rvnotsdsuvfrcginjbiw.supabase.co";
const SUPABASE_KEY = "sb_publishable_IIeNY6wKVAZpFREXPoqS8Q_4mXjivYf";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);

let conversations = [];
let currentId = null;
let sending = false;
let currentUserId = null;

function currentConversation() {
  return conversations.find(c => c.id === currentId);
}

async function saveConversation() {
  const conversation = currentConversation();
  if (!conversation || !currentUserId) return;

  const { error } = await db.from("conversations").upsert({
    id: conversation.id,
    user_id: currentUserId,
    title: conversation.title,
    messages: conversation.messages,
    updated_at: new Date().toISOString()
  });

  if (error) {
    $("chatStatus").textContent = "Save error: " + error.message;
  }
}

async function newConversation() {
  const conversation = {
    id: crypto.randomUUID(),
    title: "New Chat",
    messages: [],
    updated_at: new Date().toISOString()
  };

  conversations.unshift(conversation);
  currentId = conversation.id;
  render();
  await saveConversation();
}

function render() {
  const conversation = currentConversation();

  $("history").replaceChildren();

  conversations.forEach(c => {
    const button = document.createElement("button");
    button.className = "history-item" +
      (c.id === currentId ? " active" : "");
    button.textContent = c.title;
    button.onclick = () => {
      currentId = c.id;
      render();
    };
    $("history").appendChild(button);
  });

  $("messages").replaceChildren();

  const list = conversation ? conversation.messages : [];
  $("welcome").classList.toggle("hidden", list.length > 0);

  list.forEach(message => {
    const div = document.createElement("div");
    div.className = "message " + message.role;

    const text = document.createElement("div");
    text.textContent = message.text;
    div.appendChild(text);

    if (message.role === "assistant") {
      const actions = document.createElement("div");
      actions.className = "message-actions";

      const copy = document.createElement("button");
      copy.textContent = "Copy response";
      copy.onclick = async () => {
        try {
          await navigator.clipboard.writeText(message.text);
          copy.textContent = "Copied!";
        } catch {
          copy.textContent = "Copy unavailable";
        }
      };

      actions.appendChild(copy);
      div.appendChild(actions);
    }

    $("messages").appendChild(div);
  });
}

async function addMessage(role, text) {
  const conversation = currentConversation();
  if (!conversation) return;

  conversation.messages.push({ role, text });

  if (conversation.title === "New Chat" && role === "user") {
    conversation.title = text.slice(0, 30);
  }

  conversation.updated_at = new Date().toISOString();

  render();
  await saveConversation();
}

async function loadHistory() {
  $("chatStatus").textContent = "Loading your conversations...";

  const { data, error } = await db
    .from("conversations")
    .select("*")
    .order("updated_at", { ascending: false });

  if (error) {
    $("chatStatus").textContent = "History error: " + error.message;
    return;
  }

  conversations = (data || []).map(c => ({
    id: c.id,
    title: c.title || "New Chat",
    messages: Array.isArray(c.messages) ? c.messages : [],
    updated_at: c.updated_at
  }));

  if (conversations.length) {
    currentId = conversations[0].id;
    render();
  } else {
    await newConversation();
  }

  $("chatStatus").textContent = "ABD AI is ready.";
}

async function updateScreen() {
  const { data, error } = await db.auth.getSession();

  if (error) {
    $("authStatus").textContent = error.message;
    return;
  }

  const session = data.session;
  const loggedIn = !!session;

  $("auth").classList.toggle("hidden", loggedIn);
  $("app").classList.toggle("hidden", !loggedIn);

  if (loggedIn && currentUserId !== session.user.id) {
    currentUserId = session.user.id;
    conversations = [];
    currentId = null;
    await loadHistory();
  }

  if (!loggedIn) {
    currentUserId = null;
    conversations = [];
    currentId = null;
  }
}

$("signup").onclick = async () => {
  $("authStatus").textContent = "Creating account...";

  const { error } = await db.auth.signUp({
    email: $("email").value.trim(),
    password: $("password").value
  });

  $("authStatus").textContent = error
    ? error.message
    : "Account created. Check your email if verification is required.";

  await updateScreen();
};

$("login").onclick = async () => {
  $("authStatus").textContent = "Signing in...";

  const { error } = await db.auth.signInWithPassword({
    email: $("email").value.trim(),
    password: $("password").value
  });

  $("authStatus").textContent = error
    ? error.message
    : "Signed in successfully.";

  await updateScreen();
};

$("logout").onclick = async () => {
  await db.auth.signOut();
  await updateScreen();
};

$("newChat").onclick = async () => {
  await newConversation();
  $("prompt").focus();
};

async function sendMessage() {
  if (sending) return;

  const message = $("prompt").value.trim();
  if (!message) return;

  if (!currentConversation()) await newConversation();

  $("prompt").value = "";
  sending = true;
  $("send").disabled = true;
  $("chatStatus").textContent = "ABD AI is thinking...";

  try {
    await addMessage("user", message);

    
const conversation = currentConversation();

const history = conversation.messages
  .slice(0, -1)
  .map(m => ({
    role: m.role,
    content: m.text
  }));

const { data, error } = await db.functions.invoke(
  "abd-ai-chat",
  {
    body: {
      message,
      history
    }
  }
);
    

    if (error) throw error;

    if (!data || !data.success || !data.reply) {
      throw new Error(data?.error || "AI response was empty.");
    }

    await addMessage("assistant", data.reply);
    $("chatStatus").textContent = "Ready";
  } catch (err) {
    $("chatStatus").textContent = "Error: " + err.message;
  } finally {
    sending = false;
    $("send").disabled = false;
    $("prompt").focus();
  }
}

$("send").onclick = sendMessage;

$("prompt").addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

db.auth.onAuthStateChange(() => {
  setTimeout(() => updateScreen(), 0);
});

updateScreen();
    
</script>
</body>
</html>
