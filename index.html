
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090d18">
<title>ABD AI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<style>
* {
  box-sizing: border-box;
}

:root {
  color-scheme: dark;
  --bg: #212121;
  --sidebar: #171717;
  --surface: #303030;
  --surface-hover: #383838;
  --text: #ececec;
  --muted: #9b9b9b;
  --border: #3b3b3b;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
}

button, input, textarea {
  font: inherit;
}

button {
  cursor: pointer;
  color: var(--text);
  background: transparent;
  border: 0;
  border-radius: 10px;
  padding: 10px 13px;
}

button:hover {
  background: var(--surface-hover);
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.hidden {
  display: none !important;
}

/* Main application */

.app {
  width: 100%;
  max-width: none;
  min-height: 100vh;
  display: flex;
  margin: 0;
  background: var(--bg);
}

/* Sidebar */

.sidebar {
  width: 260px;
  min-width: 260px;
  height: 100vh;
  position: sticky;
  top: 0;
  background: var(--sidebar);
  padding: 14px 12px;
  border: 0;
  display: flex;
  flex-direction: column;
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  margin: 5px 5px 28px;
}

.logo {
  width: 35px;
  height: 35px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: #303030;
  color: white;
  font-size: 12px;
  font-weight: bold;
}

.brand h2 {
  font-size: 17px;
  font-weight: 600;
  margin: 0;
}

.new-chat {
  width: 100%;
  text-align: left;
  background: transparent;
  border: 1px solid #444;
  margin-bottom: 27px;
  font-size: 14px;
}

.new-chat:hover {
  background: var(--surface);
}

.small-title {
  color: var(--muted);
  font-size: 12px;
  margin: 0 8px 10px;
}

#history {
  display: flex;
  flex-direction: column;
  gap: 3px;
  overflow-y: auto;
}

.history-item {
  width: 100%;
  text-align: left;
  font-size: 13px;
  color: #d6d6d6;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  padding: 10px;
}

.history-item.active {
  background: #303030;
}

/* Main chat area */

.main {
  flex: 1;
  min-width: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
}

.topbar {
  height: 58px;
  flex-shrink: 0;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border: 0;
  background: var(--bg);
}

.topbar h3 {
  font-size: 16px;
  font-weight: 600;
  margin: 0;
}

#logout {
  font-size: 13px;
  background: transparent;
  color: #bdbdbd;
}

/* Conversation content */

.content {
  width: 100%;
  max-width: 850px;
  flex: 1;
  min-height: calc(100vh - 58px);
  margin: 0 auto;
  padding: 20px 24px 12px;
  display: flex;
  flex-direction: column;
}

.welcome {
  text-align: center;
  margin: auto 0;
  padding: 35px 10px;
}

.welcome h1 {
  font-size: 30px;
  font-weight: 600;
  color: #ececec;
}

.gradient {
  color: #ececec;
  background: none;
  -webkit-text-fill-color: #ececec;
}

.welcome p {
  color: #a0a0a0 !important;
  font-size: 15px;
}

/* Messages */

#messages {
  display: flex;
  flex-direction: column;
  gap: 25px;
  padding: 20px 0 30px;
}

.message {
  max-width: 85%;
  padding: 12px 17px;
  border-radius: 18px;
  font-size: 15px;
  line-height: 1.7;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user {
  align-self: flex-end;
  background: #303030;
  color: #ececec;
}

.assistant {
  align-self: flex-start;
  background: transparent;
  color: #ececec;
  padding-left: 3px;
}

.message-actions {
  margin-top: 12px;
}

.message-actions button {
  font-size: 12px;
  padding: 7px 10px;
  color: #aaa;
  background: transparent;
}

/* Message composer */

.composer-area {
  position: sticky;
  bottom: 0;
  width: 100%;
  background: var(--bg);
  padding: 12px 0 18px;
  margin-top: auto;
}

#webSearchToggle {
  background: transparent;
  border: 1px solid #444;
  color: #c5c5c5;
  border-radius: 20px;
  padding: 8px 12px;
  font-size: 12px;
  margin-bottom: 10px;
}

.composer {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  width: 100%;
  background: #303030;
  border: 1px solid #444;
  border-radius: 25px;
  padding: 10px 12px;
}

.composer:focus-within {
  border-color: #666;
}

textarea {
  flex: 1;
  width: 100%;
  min-width: 0;
  min-height: 44px;
  max-height: 150px;
  resize: none;
  padding: 12px 5px;
  color: white;
  background: transparent;
  border: 0;
  outline: none;
  font-size: 15px;
}

textarea::placeholder {
  color: #a0a0a0;
}

#send {
  width: 42px;
  height: 42px;
  flex-shrink: 0;
  padding: 0;
  border-radius: 50%;
  background: #f1f1f1;
  color: #171717;
  font-size: 18px;
  font-weight: bold;
}

#send:hover {
  background: white;
}

.status {
  color: #888;
  font-size: 11px;
  min-height: 17px;
  margin: 8px 10px 0;
}

/* Login screen */

.auth-box {
  width: calc(100% - 30px);
  max-width: 390px;
  margin: 80px auto;
  padding: 28px;
  background: #303030;
  border: 1px solid #444;
  border-radius: 18px;
}

.auth-box input {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  color: white;
  background: #212121;
  border: 1px solid #505050;
  border-radius: 10px;
}

.auth-box button {
  width: 100%;
  margin-top: 10px;
  background: #ececec;
  color: #171717;
}

.auth-box .secondary {
  background: #444;
  color: white;
}

/* Mobile layout */

@media (max-width: 650px) {
  .sidebar {
    width: 76px;
    min-width: 76px;
    padding: 12px 5px;
  }

  .brand {
    flex-direction: column;
    gap: 5px;
    margin: 5px 0 25px;
  }

  .brand h2 {
    font-size: 10px;
  }

  .new-chat {
    text-align: center;
    padding: 10px 2px;
    font-size: 11px;
  }

  .small-title {
    font-size: 9px;
    text-align: center;
    margin: 0 0 8px;
  }

  .history-item {
    font-size: 10px;
    padding: 9px 3px;
  }

  .topbar {
    padding: 0 12px;
    height: 52px;
  }

  .topbar h3 {
    font-size: 14px;
  }

  .content {
    min-height: calc(100vh - 52px);
    padding: 12px 12px 8px;
  }

  .welcome h1 {
    font-size: 25px;
  }

  .message {
    max-width: 95%;
    font-size: 14px;
  }

  .composer {
    border-radius: 23px;
    padding: 7px 9px;
  }

  textarea {
    font-size: 14px;
  }
}
  </style>
  
<body>

<div id="auth" class="auth-box">
  <div class="brand">
    <div class="logo">ABD</div>
    <h2>ABD AI</h2>
  </div>
  <p>Welcome to your AI assistant.</p>
  <input id="email" type="email" placeholder="Email address">
  <input id="password" type="password" placeholder="Password">
  <button id="signup">Create account</button>
  <button id="login" class="secondary">Sign in</button>
  <p id="authStatus" class="status"></p>
</div>

<div id="app" class="app hidden">

  <aside class="sidebar">
    <div class="brand">
      <div class="logo">ABD</div>
      <h2>ABD AI</h2>
    </div>

    <button class="new-chat" id="newChat">＋ New Chat</button>

    <div class="small-title">YOUR CONVERSATIONS</div>
    <div id="history"></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h3>ABD AI Assistant</h3>
      <button class="secondary" id="logout">Sign out</button>
    </header>

    <section class="content">
      <div id="welcome" class="welcome">
        <h1>Welcome to <span class="gradient">ABD AI</span></h1>
        <p style="color:#929bb1">
          What would you like to know today?
        </p>
      </div>

      <div id="messages"></div>

      <div class="composer-area">
        <button id="webSearchToggle" class="secondary" type="button">
  🌐 Internet Search: OFF
        </button>
        <div class="composer">
          <textarea id="prompt"
            placeholder="Message ABD AI..."
            rows="1"></textarea>
          <button id="send">Send</button>
        </div>
        <div id="chatStatus" class="status">
          ABD AI is ready.
        </div>
      </div>
    </section>
  </main>
</div>

<script>

const SUPABASE_URL = "https://rvnotsdsuvfrcginjbiw.supabase.co";
const SUPABASE_KEY = "sb_publishable_IIeNY6wKVAZpFREXPoqS8Q_4mXjivYf";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);

let conversations = [];
let currentId = null;
let sending = false;
  let webSearchEnabled = false;

$("webSearchToggle").onclick = () => {
  webSearchEnabled = !webSearchEnabled;

  $("webSearchToggle").textContent =
    webSearchEnabled
      ? "🌐 Internet Search: ON"
      : "🌐 Internet Search: OFF";
};
let currentUserId = null;

function currentConversation() {
  return conversations.find(c => c.id === currentId);
}

async function saveConversation() {
  const conversation = currentConversation();
  if (!conversation || !currentUserId) return;

  const { error } = await db.from("conversations").upsert({
    id: conversation.id,
    user_id: currentUserId,
    title: conversation.title,
    messages: conversation.messages,
    updated_at: new Date().toISOString()
  });

  if (error) {
    $("chatStatus").textContent = "Save error: " + error.message;
  }
}

async function newConversation() {
  const conversation = {
    id: crypto.randomUUID(),
    title: "New Chat",
    messages: [],
    updated_at: new Date().toISOString()
  };

  conversations.unshift(conversation);
  currentId = conversation.id;
  render();
  await saveConversation();
}

function render() {
  const conversation = currentConversation();

  $("history").replaceChildren();

  conversations.forEach(c => {
    const button = document.createElement("button");
    button.className = "history-item" +
      (c.id === currentId ? " active" : "");
    button.textContent = c.title;
    button.onclick = () => {
      currentId = c.id;
      render();
    };
    $("history").appendChild(button);
  });

  $("messages").replaceChildren();

  const list = conversation ? conversation.messages : [];
  $("welcome").classList.toggle("hidden", list.length > 0);

  list.forEach(message => {
    const div = document.createElement("div");
    div.className = "message " + message.role;

    const text = document.createElement("div");
    text.textContent = message.text;
    div.appendChild(text);

    if (message.role === "assistant") {
      const actions = document.createElement("div");
      actions.className = "message-actions";

      const copy = document.createElement("button");
      copy.textContent = "Copy response";
      copy.onclick = async () => {
        try {
          await navigator.clipboard.writeText(message.text);
          copy.textContent = "Copied!";
        } catch {
          copy.textContent = "Copy unavailable";
        }
      };

      actions.appendChild(copy);
      div.appendChild(actions);
    }

    $("messages").appendChild(div);
  });
}

async function addMessage(role, text) {
  const conversation = currentConversation();
  if (!conversation) return;

  conversation.messages.push({ role, text });

  if (conversation.title === "New Chat" && role === "user") {
    conversation.title = text.slice(0, 30);
  }

  conversation.updated_at = new Date().toISOString();

  render();
  await saveConversation();
}

async function loadHistory() {
  $("chatStatus").textContent = "Loading your conversations...";

  const { data, error } = await db
    .from("conversations")
    .select("*")
    .order("updated_at", { ascending: false });

  if (error) {
    $("chatStatus").textContent = "History error: " + error.message;
    return;
  }

  conversations = (data || []).map(c => ({
    id: c.id,
    title: c.title || "New Chat",
    messages: Array.isArray(c.messages) ? c.messages : [],
    updated_at: c.updated_at
  }));

  if (conversations.length) {
    currentId = conversations[0].id;
    render();
  } else {
    await newConversation();
  }

  $("chatStatus").textContent = "ABD AI is ready.";
}

async function updateScreen() {
  const { data, error } = await db.auth.getSession();

  if (error) {
    $("authStatus").textContent = error.message;
    return;
  }

  const session = data.session;
  const loggedIn = !!session;

  $("auth").classList.toggle("hidden", loggedIn);
  $("app").classList.toggle("hidden", !loggedIn);

  if (loggedIn && currentUserId !== session.user.id) {
    currentUserId = session.user.id;
    conversations = [];
    currentId = null;
    await loadHistory();
  }

  if (!loggedIn) {
    currentUserId = null;
    conversations = [];
    currentId = null;
  }
}

$("signup").onclick = async () => {
  $("authStatus").textContent = "Creating account...";

  const { error } = await db.auth.signUp({
    email: $("email").value.trim(),
    password: $("password").value
  });

  $("authStatus").textContent = error
    ? error.message
    : "Account created. Check your email if verification is required.";

  await updateScreen();
};

$("login").onclick = async () => {
  $("authStatus").textContent = "Signing in...";

  const { error } = await db.auth.signInWithPassword({
    email: $("email").value.trim(),
    password: $("password").value
  });

  $("authStatus").textContent = error
    ? error.message
    : "Signed in successfully.";

  await updateScreen();
};

$("logout").onclick = async () => {
  await db.auth.signOut();
  await updateScreen();
};

$("newChat").onclick = async () => {
  await newConversation();
  $("prompt").focus();
};

async function sendMessage() {
  if (sending) return;

  const message = $("prompt").value.trim();
  if (!message) return;

  if (!currentConversation()) await newConversation();

  $("prompt").value = "";
  sending = true;
  $("send").disabled = true;
  $("chatStatus").textContent = "ABD AI is thinking...";

  try {
    await addMessage("user", message);

    
const conversation = currentConversation();

const history = conversation.messages
  .slice(0, -1)
  .map(m => ({
    role: m.role,
    content: m.text
  }));

const { data, error } = await db.functions.invoke(
  "abd-ai-chat",
  {
    body: {
  message,
  history,
  web_search: webSearchEnabled
    }
  }
);
    

    if (error) throw error;

    if (!data || !data.success || !data.reply) {
      throw new Error(data?.error || "AI response was empty.");
    }

    await addMessage("assistant", data.reply);
    $("chatStatus").textContent = "Ready";
  } catch (err) {
    $("chatStatus").textContent = "Error: " + err.message;
  } finally {
    sending = false;
    $("send").disabled = false;
    $("prompt").focus();
  }
}

$("send").onclick = sendMessage;

$("prompt").addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

db.auth.onAuthStateChange(() => {
  setTimeout(() => updateScreen(), 0);
});

updateScreen();
    
</script>
</body>
</html>
